services:
  db:
    image: postgres:16
    container_name: expense_tracker_db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: expense_tracker_api
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=expense_tracker;Username=postgres;Password=postgres"
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data: